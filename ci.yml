# ============================================================
# NEMESIS-CRAB-V2 - GitHub Actions CI (Alpine)
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ---------- Validate ----------
  validate:
    name: Validate YAML & Dockerfile
    runs-on: ubuntu-latest
    container:
      image: alpine:3.19
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apk add --no-cache python3 py3-yaml yamllint

      - name: Validate YAML
        run: |
          for f in docker-compose.yml docker-compose.dev.yml docker-compose.prod.yml; do
            [ -f "$f" ] && python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "✅ $f"
          done

  # ---------- Lint ----------
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    container:
      image: python:3.11-alpine3.19
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          apk add --no-cache gcc musl-dev libffi-dev openssl-dev libpcap-dev linux-headers make
          pip install --upgrade pip
          pip install ruff pyflakes pycodestyle

      - name: Python syntax check
        run: python -m py_compile nemesis_crab_v2.py

      - name: Ruff
        run: ruff check nemesis_crab_v2.py || true

      - name: Pyflakes
        run: pyflakes nemesis_crab_v2.py || true

  # ---------- Test ----------
  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    container:
      image: python:${{ matrix.python }}-alpine3.19
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apk add --no-cache gcc musl-dev libffi-dev openssl-dev libpcap-dev \
                          linux-headers make nmap curl wget whois

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Dependency check
        run: python requirements-check.py || true

      - name: Health check
        run: python health.py --json

      - name: Unit tests
        run: python test-command.py || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python }}
          path: |
            dependency_report.json
            test_summary.json
          retention-days: 7

  # ---------- Docker Build ----------
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [validate, lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ---------- Security Scan ----------
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
