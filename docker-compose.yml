# ============================================================
# NEMESIS-CRAB-V2 - Docker Compose (Full Stack)
# ============================================================
version: "3.9"

name: nemesis-crab

x-common-env: &common-env
  TZ: UTC
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------- Core Application ----------
  nemesis-crab:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: nemesis-crab-v2:2.0.0
    container_name: nemesis-crab
    hostname: nemesis-crab
    restart: unless-stopped
    tty: true
    stdin_open: true
    init: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - NET_BIND_SERVICE
    network_mode: host
    environment:
      <<: *common-env
      NEMESIS_MODE: production
      NEMESIS_WEB_PORT: "5000"
      NEMESIS_AGENT_PORT: "5555"
      NEMESIS_C2_PORT: "4444"
    volumes:
      - nemesis-data:/app/.nemesis_crab_v2
      - nemesis-reports:/app/nemesis_reports
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "/app/health.py", "--json", "--exit-code"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *common-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ---------- Redis (for state sharing) ----------
  redis:
    image: redis:7-alpine
    container_name: nemesis-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-nemesis_redis_pass}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nemesis_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *common-logging

  # ---------- PostgreSQL (for persistent storage) ----------
  postgres:
    image: postgres:16-alpine
    container_name: nemesis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nemesis
      POSTGRES_USER: nemesis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemesis_pg_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemesis -d nemesis"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *common-logging

  # ---------- Nginx (reverse proxy for web dashboard) ----------
  nginx:
    image: nginx:1.25-alpine
    container_name: nemesis-nginx
    restart: unless-stopped
    depends_on:
      - nemesis-crab
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *common-logging

  # ---------- Prometheus (metrics) ----------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nemesis-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    logging: *common-logging

  # ---------- Grafana (dashboards) ----------
  grafana:
    image: grafana/grafana:10.2.2
    container_name: nemesis-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-nemesis_grafana}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    logging: *common-logging

  # ---------- Loki (log aggregation) ----------
  loki:
    image: grafana/loki:2.9.3-alpine
    container_name: nemesis-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    logging: *common-logging

  # ---------- Promtail (log shipper) ----------
  promtail:
    image: grafana/promtail:2.9.3
    container_name: nemesis-promtail
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    logging: *common-logging

volumes:
  nemesis-data:
  nemesis-reports:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:
  nginx-logs:

networks:
  default:
    name: nemesis-net
    driver: bridge
