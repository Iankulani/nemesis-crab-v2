# ============================================================
# NEMESIS-CRAB-V2 - Docker Buildx Bake
# Usage: docker buildx bake
# ============================================================
variable "REGISTRY" { default = "registry.gitlab.com/your-org" }
variable "TAG"      { default = "latest" }
variable "VERSION"  { default = "2.0.0" }

group "default" {
  targets = ["runtime", "dev"]
}

target "common" {
  context    = "."
  dockerfile = "Dockerfile"
  platforms  = ["linux/amd64", "linux/arm64"]
  labels = {
    "org.opencontainers.image.title"       = "nemesis-crab-v2"
    "org.opencontainers.image.version"     = "${VERSION}"
    "org.opencontainers.image.description" = "Ultimate Cybersecurity Command & Control Platform"
    "org.opencontainers.image.authors"     = "Ian Carter Kulani"
  }
  cache-from = ["type=registry,ref=${REGISTRY}/nemesis-crab-v2:buildcache"]
  cache-to   = ["type=registry,ref=${REGISTRY}/nemesis-crab-v2:buildcache,mode=max"]
}

target "runtime" {
  inherits = ["common"]
  target   = "runtime"
  tags = [
    "${REGISTRY}/nemesis-crab-v2:${TAG}",
    "${REGISTRY}/nemesis-crab-v2:${VERSION}",
  ]
}

target "dev" {
  inherits   = ["common"]
  dockerfile = "Dockerfile.dev"
  tags       = ["${REGISTRY}/nemesis-crab-v2:dev"]
}
